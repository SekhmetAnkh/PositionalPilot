name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  SEKHMETPLUGINS_DISPATCH_TOKEN: ${{ secrets.SEKHMETPLUGINS_DISPATCH_TOKEN }}

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Restore
        run: dotnet restore PositionalPilot.sln

      - name: Install Dalamud dev files
        shell: pwsh
        run: |
          $hooks = Join-Path $env:APPDATA "XIVLauncher/addon/Hooks/dev"
          New-Item -ItemType Directory -Force -Path $hooks | Out-Null
          Invoke-WebRequest -UseBasicParsing "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          Expand-Archive "$env:RUNNER_TEMP/dalamud.zip" -DestinationPath $hooks -Force

      - name: Test geometry core
        run: dotnet test PositionalPilot.Tests/PositionalPilot.Tests.csproj --configuration Release --no-restore

      - name: Build plugin package
        run: dotnet build PositionalPilot/PositionalPilot.csproj --configuration Release --no-restore

      - name: Locate Dalamud package
        id: package
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path PositionalPilot -Recurse -Filter latest.zip | Select-Object -First 1
          if (-not $zip) {
            throw "DalamudPackager did not produce latest.zip"
          }
          $asset = Join-Path $env:RUNNER_TEMP "PositionalPilot-latest.zip"
          Copy-Item $zip.FullName $asset -Force
          "zip=$asset" >> $env:GITHUB_OUTPUT

      - name: Determine release target
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            "name=PositionalPilot ${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }
          else {
            "tag=latest" >> $env:GITHUB_OUTPUT
            "name=PositionalPilot latest" >> $env:GITHUB_OUTPUT
          }

      - name: Move latest tag
        if: ${{ steps.release.outputs.tag == 'latest' }}
        shell: pwsh
        run: |
          git tag -f latest ${{ github.sha }}
          git push origin latest --force

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
          name: ${{ steps.release.outputs.name }}
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          make_latest: true

      - name: Dispatch pluginmaster update
        if: ${{ env.SEKHMETPLUGINS_DISPATCH_TOKEN != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ env.SEKHMETPLUGINS_DISPATCH_TOKEN }}
        run: |
          $payload = @{
            event_type = "update-pluginmaster"
            client_payload = @{
              repository = "${{ github.repository }}"
              tag = "${{ steps.release.outputs.tag }}"
            }
          } | ConvertTo-Json -Compress

          $payload | gh api repos/SekhmetAnkh/SekhmetPlugins/dispatches --method POST --input -
